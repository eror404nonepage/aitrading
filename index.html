<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trading Bot</title>
<style>
:root {
  color-scheme: dark;
  --black: #000;
  --white: #fff;
  --text: #f1f2f4;
  --silver: #c4c8d0;
  --silver-dim: #8e939c;
  --silver-line: rgba(196, 200, 208, 0.35);
  --silver-faint: rgba(196, 200, 208, 0.14);
  --silver-glow: rgba(224, 228, 235, 0.45);
  --gold-light: #f6d776;
  --gold-dark: #c99a1e;
  --danger: #d32f2f;
}

*, *::before, *::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  background: var(--black);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--silver);
  outline-offset: 2px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  padding: 0 12px 0 6px;
  background: var(--black);
}

.topbar::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 1px;
  background: var(--silver-dim);
  box-shadow: 0 0 8px 1px var(--silver-line);
  pointer-events: none;
}

.menu-button {
  display: grid;
  align-content: center;
  justify-items: center;
  gap: 4px;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  background: none;
  -webkit-tap-highlight-color: transparent;
}

.menu-button span {
  width: 22px;
  height: 2px;
  background: var(--white);
}

.actions {
  display: flex;
  gap: 8px;
}

.gold-button {
  height: 34px;
  padding: 0 18px;
  border: 1px solid var(--black);
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold-light), var(--gold-dark));
  color: var(--black);
  font-size: 14px;
  font-weight: 700;
}

.logout {
  position: fixed;
  top: 12px;
  right: 12px;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0, 0, 0, 0.6);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.side-menu {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  width: min(50vw, 240px);
  overflow-y: auto;
  background: var(--black);
  border-right: 1px solid var(--silver-line);
  transform: translateX(-100%);
  visibility: hidden;
  transition: transform 0.25s ease, visibility 0s linear 0.25s;
}

.side-menu.open {
  transform: none;
  visibility: visible;
  transition: transform 0.25s ease;
}

.menu-item {
  padding: 16px 18px;
  border-bottom: 1px solid var(--silver-faint);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
}

.menu-item:hover,
.menu-item:focus-visible {
  background: var(--silver-faint);
}

.menu-item:focus-visible {
  outline-offset: -3px;
}

dialog {
  width: min(380px, calc(100% - 32px));
  max-height: calc(100dvh - 32px);
  padding: 0;
  overflow: auto;
  border: 1px solid var(--silver-line);
  border-radius: 20px;
  background: var(--black);
  color: var(--text);
}

dialog::backdrop {
  background: rgba(0, 0, 0, 0.75);
}

dialog form {
  padding: 26px 24px;
}

.field-wrap {
  position: relative;
  margin-bottom: 14px;
}

.field {
  display: block;
  width: 100%;
  height: 46px;
  padding: 0 16px;
  border: 1px solid var(--silver-line);
  border-radius: 12px;
  background: transparent;
  color: var(--text);
  font-size: 16px;
  outline: none;
}

.field::placeholder {
  color: var(--silver-dim);
}

.field:focus {
  border-color: var(--silver);
  box-shadow: 0 0 12px var(--silver-glow);
}

.field:-webkit-autofill {
  -webkit-text-fill-color: var(--text);
  transition: background-color 9999s ease-out;
}

.field[aria-invalid="true"] {
  border-color: var(--danger);
  box-shadow: 0 0 0 1px var(--danger);
}

.field-password {
  padding-right: 48px;
}

.eye {
  position: absolute;
  top: 0;
  right: 0;
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: none;
  color: var(--silver-dim);
}

.eye[aria-pressed="true"] {
  color: var(--silver);
}

.eye svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.eye .slash {
  display: none;
}

.eye[aria-pressed="true"] .slash {
  display: inline;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 4px 0 14px;
  color: var(--silver);
  font-size: 14px;
  line-height: 1.45;
  cursor: pointer;
}

.consent input {
  flex: none;
  width: 20px;
  height: 20px;
  margin: 1px 0 0;
  accent-color: var(--gold-dark);
}

.consent input[aria-invalid="true"] {
  outline: 2px solid var(--danger);
  outline-offset: 2px;
}

.consent a {
  color: var(--gold-light);
}

dialog .gold-button {
  display: block;
  height: 42px;
  margin: 8px auto 0;
  padding: 0 36px;
  font-size: 15px;
}

.toast {
  position: fixed;
  top: 16px;
  left: 50%;
  width: max-content;
  max-width: calc(100vw - 32px);
  margin: 0;
  padding: 12px 18px;
  border-radius: 12px;
  background: var(--danger);
  color: var(--white);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  text-align: center;
  opacity: 0;
  transform: translate(-50%, -24px);
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (prefers-reduced-motion: reduce) {
  .overlay, .side-menu, .toast {
    transition: none;
  }
}
</style>
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <button class="menu-button" id="menuButton" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sideMenu"><span></span><span></span><span></span></button>
  <div class="actions">
    <button class="gold-button" type="button" data-open="signupDialog">Sign Up</button>
    <button class="gold-button" type="button" data-open="loginDialog">Log In</button>
  </div>
</header>
<button class="gold-button logout" id="logoutButton" type="button" hidden>Log Out</button>

<nav class="side-menu" id="sideMenu" aria-label="Menu">
  <a class="menu-item" href="#home">Home</a>
  <a class="menu-item" href="#market">Market</a>
  <a class="menu-item" href="#faq">FAQ</a>
  <a class="menu-item" href="#terms-of-service">Terms of Service</a>
  <a class="menu-item" href="#privacy-policy">Privacy Policy</a>
  <a class="menu-item" href="#why-ai-trading">Why AI Trading?</a>
  <a class="menu-item" href="#get-started">Get Started</a>
  <a class="menu-item" href="#support">Support</a>
</nav>
<div class="overlay" id="overlay"></div>

<main>
  <section id="home" hidden></section>
  <section id="market" hidden></section>
  <section id="faq" hidden></section>
  <section id="terms-of-service" hidden></section>
  <section id="privacy-policy" hidden></section>
  <section id="why-ai-trading" hidden></section>
  <section id="get-started" hidden></section>
  <section id="support" hidden></section>
</main>

<dialog id="signupDialog" aria-label="Sign Up">
  <form id="signupForm" novalidate>
    <div class="field-wrap">
      <input class="field" name="username" type="text" placeholder="Username" aria-label="Username" maxlength="15" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    </div>
    <div class="field-wrap">
      <input class="field" name="email" type="text" inputmode="email" placeholder="Email Address" aria-label="Email Address" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false">
    </div>
    <div class="field-wrap">
      <input class="field field-password" name="newPassword" type="password" placeholder="Password" aria-label="Password" maxlength="20" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button class="eye" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
    </div>
    <label class="consent"><input name="terms" type="checkbox"><span>I confirm that I am at least 18 years old and I agree to the <a href="#terms-of-service" target="_blank" rel="noopener">Terms of Use</a>.</span></label>
    <button class="gold-button" type="submit">Sign Up</button>
    <p class="toast" role="alert"></p>
  </form>
</dialog>

<dialog id="loginDialog" aria-label="Log In">
  <form id="loginForm" novalidate>
    <div class="field-wrap">
      <input class="field" name="identifier" type="text" placeholder="Username or Email Address" aria-label="Username or Email Address" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    </div>
    <div class="field-wrap">
      <input class="field field-password" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button class="eye" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
    </div>
    <button class="gold-button" type="submit">Log In</button>
    <p class="toast" role="alert"></p>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://wrmapzfhhdmlbubnafli.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vcH8DzDU08pJdDNOaTQj2A_tQ4FHyNi';

const topbar = document.getElementById('topbar');
const menuButton = document.getElementById('menuButton');
const sideMenu = document.getElementById('sideMenu');
const overlay = document.getElementById('overlay');
const logoutButton = document.getElementById('logoutButton');
const sections = [...document.querySelectorAll('main section')];

const emailPattern = /^[a-z0-9._+-]+@([a-z0-9-]+\.)+[a-z]{2,}$/;
const typedInput = ['insertText', 'insertCompositionText'];
const lowercased = ['username', 'email', 'identifier'];

const filters = {
  username: /[^a-z]/g,
  email: /[^a-z0-9@._+-]/g,
  identifier: /[^a-z0-9@._+-]/g,
  newPassword: /[^\x21-\x7e]/g,
  password: /[^\x21-\x7e]/g
};

const rules = {
  username: [
    [value => !value, 'Username is required.'],
    [value => value.length < 3, 'Username must be at least 3 letters long.']
  ],
  email: [
    [value => !value, 'Email Address is required.'],
    [value => !emailPattern.test(value), 'Enter a full email address, for example name@gmail.com.']
  ],
  newPassword: [
    [value => !value, 'Password is required.'],
    [value => value.length < 10, 'Password must be 10 to 20 characters long.']
  ],
  identifier: [
    [value => !value, 'Username or Email Address is required.'],
    [value => value.includes('@') ? !emailPattern.test(value) : !/^[a-z]{3,15}$/.test(value), 'Enter a valid username or email address.']
  ],
  password: [
    [value => !value, 'Password is required.']
  ],
  terms: [
    [(value, input) => !input.checked, 'You must confirm you are 18 or older and agree to the Terms of Use.']
  ]
};

const failures = {
  username_taken: ['This username is already taken.', ['username']],
  user_already_exists: ['This email address is already registered.', ['email']],
  email_exists: ['This email address is already registered.', ['email']],
  email_address_invalid: ['This email address is not accepted. Use a real email address.', ['email']],
  invalid_credentials: ['Incorrect username, email address or password.', ['identifier', 'password']],
  email_not_confirmed: ['Please confirm your email address to continue.'],
  over_request_rate_limit: ['Too many attempts. Please try again later.'],
  PGRST202: ['The database rules are not installed yet. Run database.sql in Supabase.']
};

const fail = code => Object.assign(new Error(code), { code });

function setMenu(open) {
  if (sideMenu.classList.contains('open') === open) return;
  sideMenu.classList.toggle('open', open);
  overlay.classList.toggle('open', open);
  menuButton.setAttribute('aria-expanded', String(open));
  topbar.inert = open;
  if (open) sideMenu.querySelector('.menu-item').focus();
  else menuButton.focus();
}

function showSection() {
  const current = sections.find(section => section.id === location.hash.slice(1)) || sections[0];
  sections.forEach(section => {
    section.hidden = section !== current;
  });
}

function showPassword(button, visible) {
  button.previousElementSibling.type = visible ? 'text' : 'password';
  button.setAttribute('aria-pressed', String(visible));
  button.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
}

function toast(form, message) {
  const popup = form.querySelector('.toast');
  if (popup.classList.contains('show')) return;
  popup.textContent = message;
  popup.classList.add('show');
  popup.timer = setTimeout(() => popup.classList.remove('show'), 3000);
}

function check(input) {
  const rule = rules[input.name].find(([test]) => test(input.value, input));
  if (rule) input.setAttribute('aria-invalid', 'true');
  else input.removeAttribute('aria-invalid');
  return rule ? rule[1] : '';
}

function sanitize(input, typed) {
  const pattern = filters[input.name];
  const value = !typed && lowercased.includes(input.name) ? input.value.toLowerCase() : input.value;
  const clean = value.replace(pattern, '');
  if (clean === input.value) return;
  const caret = value.slice(0, input.selectionStart).replace(pattern, '').length;
  input.value = clean;
  input.setSelectionRange(caret, caret);
}

let availabilityTimer;

function watchUsername(input) {
  clearTimeout(availabilityTimer);
  const value = input.value;
  if (!/^[a-z]{3,15}$/.test(value)) return;
  availabilityTimer = setTimeout(async () => {
    const { data } = await sb.rpc('username_available', { p_username: value });
    if (data === false && input.value === value) input.setAttribute('aria-invalid', 'true');
  }, 400);
}

function validate(form) {
  const inputs = [...form.querySelectorAll('input[name]')];
  const messages = inputs.map(input => check(input));
  const index = messages.findIndex(Boolean);
  if (index === -1) return true;
  toast(form, messages[index]);
  inputs[index].focus();
  return false;
}

function resetForm(form) {
  const popup = form.querySelector('.toast');
  clearTimeout(popup.timer);
  popup.classList.remove('show');
  form.reset();
  form.querySelectorAll('[aria-invalid]').forEach(input => input.removeAttribute('aria-invalid'));
  form.querySelectorAll('.eye').forEach(button => showPassword(button, false));
}

function describe(error) {
  if (failures[error.code]) return failures[error.code];
  if (/failed to fetch|load failed|network/i.test(error.message)) return ['Cannot reach the server. Check your internet connection.'];
  return [error.message || 'Something went wrong. Please try again.'];
}

async function submit(form, action) {
  const button = form.querySelector('[type="submit"]');
  button.disabled = true;
  try {
    await action();
    form.closest('dialog').close();
  } catch (error) {
    const [message, names = []] = describe(error);
    names.forEach(name => form.elements[name].setAttribute('aria-invalid', 'true'));
    toast(form, message);
  } finally {
    button.disabled = false;
  }
}

menuButton.addEventListener('click', () => setMenu(true));
overlay.addEventListener('click', () => setMenu(false));
sideMenu.addEventListener('click', event => {
  if (event.target.closest('.menu-item')) setMenu(false);
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') setMenu(false);
});

document.querySelectorAll('[data-open]').forEach(button => {
  button.addEventListener('click', () => document.getElementById(button.dataset.open).showModal());
});

document.querySelectorAll('dialog').forEach(dialog => {
  const form = dialog.querySelector('form');
  dialog.addEventListener('click', event => {
    if (event.target === dialog) dialog.close();
  });
  dialog.addEventListener('close', () => resetForm(form));
  form.querySelectorAll('input[name]').forEach(input => {
    const filter = filters[input.name];
    if (filter) {
      input.addEventListener('beforeinput', event => {
        if (event.inputType === 'insertText' && event.data && event.data.replace(filter, '') !== event.data) event.preventDefault();
      });
    }
    input.addEventListener('input', event => {
      if (filter) sanitize(input, typedInput.includes(event.inputType));
      input.removeAttribute('aria-invalid');
      if (input.name === 'username') watchUsername(input);
    });
  });
});

document.querySelectorAll('.eye').forEach(button => {
  button.addEventListener('mousedown', event => event.preventDefault());
  button.addEventListener('click', () => showPassword(button, button.getAttribute('aria-pressed') !== 'true'));
});

window.addEventListener('hashchange', showSection);
showSection();

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('signupForm').addEventListener('submit', event => {
  event.preventDefault();
  const form = event.currentTarget;
  if (!validate(form)) return;
  const { username, email, newPassword } = form.elements;
  submit(form, async () => {
    const availability = await sb.rpc('username_available', { p_username: username.value });
    if (availability.error) throw availability.error;
    if (!availability.data) throw fail('username_taken');
    const { data, error } = await sb.auth.signUp({
      email: email.value,
      password: newPassword.value,
      options: { data: { username: username.value, terms_accepted: true } }
    });
    if (error) throw error;
    if (!data.session) throw fail('email_not_confirmed');
  });
});

document.getElementById('loginForm').addEventListener('submit', event => {
  event.preventDefault();
  const form = event.currentTarget;
  if (!validate(form)) return;
  const { identifier, password } = form.elements;
  submit(form, async () => {
    let email = identifier.value;
    if (!email.includes('@')) {
      const lookup = await sb.rpc('login_email', { p_username: email });
      if (lookup.error) throw lookup.error;
      if (!lookup.data) throw fail('invalid_credentials');
      email = lookup.data;
    }
    const { error } = await sb.auth.signInWithPassword({ email, password: password.value });
    if (error) throw error;
  });
});

logoutButton.addEventListener('click', () => sb.auth.signOut({ scope: 'local' }));

sb.auth.onAuthStateChange((_, session) => {
  topbar.hidden = Boolean(session);
  logoutButton.hidden = !session;
});
</script>
</body>
</html>
